<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#FF2DFF"/>
    </linearGradient>
    <linearGradient id="shipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Cosmic Ring -->
  <circle cx="50" cy="50" r="44" fill="#0A0F2C" stroke="url(#portalGrad)" stroke-width="4" filter="url(#glow)" />
  <circle cx="50" cy="50" r="36" fill="none" stroke="#00E5FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- Sleek Spaceship Silhouette breaking through -->
  <path d="M50 14 L57 38 L76 68 L58 64 L50 78 L42 64 L24 68 L43 38 Z" fill="url(#shipGrad)" filter="url(#glow)" />
  <polygon points="50,22 54,42 50,56 46,42" fill="#FFFFFF" />
  
  <!-- Engine Thruster Glow -->
  <circle cx="50" cy="74" r="3" fill="#00E5FF" filter="url(#glow)" />
</svg>